services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    build: ./server
    environment:
      PORT: "3001"
      INSTANCE_ID: api-1
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: commerce
      DB_USER: commerce
      DB_PASSWORD: commerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3001:3001"
    volumes:
      - ./server/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    build: ./server
    environment:
      PORT: "3002"
      INSTANCE_ID: api-2
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: commerce
      DB_USER: commerce
      DB_PASSWORD: commerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3002:3002"
    volumes:
      - ./server/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-3:
    build: ./server
    environment:
      PORT: "3003"
      INSTANCE_ID: api-3
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: commerce
      DB_USER: commerce
      DB_PASSWORD: commerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3003:3003"
    volumes:
      - ./server/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-1
      - api-2
      - api-3

  adminer:
    image: shyim/adminerevo:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
    depends_on:
      - nginx

volumes:
  pgdata:
